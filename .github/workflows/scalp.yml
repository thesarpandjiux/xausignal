name: scalp

# Mode scalping — TERPISAH dari signal.yml (mode swing). Jalan tiap 15 menit
# karena timeframe entry M5 butuh evaluasi lebih sering dari mode swing (H1).
#
# State (scalp_state.json) di branch TERPISAH bot-scalp, bukan bot-data —
# sama alasan dengan bot-cmd/bot-calib: signal.yml push --force ke bot-data
# di menit lain, menaruh data tak berhubungan di branch yang sama adalah
# persis penyebab bug #15 (dua workflow saling menimpa state).
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scalp
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - name: Ambil state sebelumnya
        env:
          REPO_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          rm -rf /tmp/botscalp
          if git ls-remote --exit-code --heads "$REPO_URL" bot-scalp >/dev/null 2>&1; then
            git clone --quiet --depth=1 --branch bot-scalp "$REPO_URL" /tmp/botscalp
          else
            mkdir -p /tmp/botscalp
            echo "belum ada state — run pertama"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Jalankan bot scalp
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          XAU_HOME: /tmp/botscalp
        run: python xau_scalp.py

      - name: Simpan state
        if: always()
        env:
          REPO_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          cd /tmp/botscalp
          rm -rf cache
          [ -e .git ] || git init -q -b bot-scalp
          git config user.name  "xausignal-bot"
          git config user.email "bot@users.noreply.github.com"
          git remote set-url origin "$REPO_URL" 2>/dev/null \
            || git remote add origin "$REPO_URL"
          git add -A
          if git diff --cached --quiet; then
            echo "tidak ada perubahan state"
          else
            git commit -q -m "scalp state: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push -q origin HEAD:bot-scalp --force
            echo "state tersimpan"
          fi
