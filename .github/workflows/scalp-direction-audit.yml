name: scalp-direction-audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  historical-data-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas dukascopy-python certifi
      - run: python audit-h1-validation/check_window.py
      - run: python audit-h1-validation/fetch_window.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h1-cross-period-data
          path: audit-h1-validation/
          if-no-files-found: error
          retention-days: 30
