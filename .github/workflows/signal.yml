name: signal

# Berjalan di server GitHub, bukan di komputer Anda.
# Laptop boleh mati, bot tetap jalan.
on:
  schedule:
    # Menit 13, bukan 5. GitHub memproses gelombang tugas terjadwal di awal
    # tiap jam; menit ganjil di luar puncak dilayani jauh lebih cepat.
    # Jadwal tetap "best effort" — bisa tertunda, kadang dilewati.
    - cron: "13 * * * *"
  workflow_dispatch:          # tombol jalankan manual

# Wajib: workflow menulis balik state ke branch bot-data
permissions:
  contents: write

# Cegah dua run bertabrakan saat satu tertunda
concurrency:
  group: signal
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Ambil state sebelumnya
        # State (signals.csv, state.json) disimpan di branch bot-data.
        # Tanpa ini tiap run mulai dari nol: cooldown mati dan sinyal yang
        # sama terkirim berulang tiap jam.
        #
        # Pakai clone biasa, BUKAN git worktree: pada worktree, .git adalah
        # BERKAS bukan folder, sehingga pemeriksaan repo di langkah simpan
        # meleset dan mencoba init ulang.
        env:
          REPO_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          rm -rf /tmp/botdata
          if git ls-remote --exit-code --heads "$REPO_URL" bot-data >/dev/null 2>&1; then
            git clone --quiet --depth=1 --branch bot-data "$REPO_URL" /tmp/botdata
            echo "state ditemukan: $(ls /tmp/botdata | tr '\n' ' ')"
          else
            mkdir -p /tmp/botdata
            echo "belum ada state — run pertama"
          fi

      - name: Ambil kalibrasi terbaru
        # bot-calib diisi backtest.yml sekali sehari. Terpisah dari bot-data
        # (yang di-force-push signal.yml & commands.yml di jam lain) supaya
        # tidak saling timpa — sama seperti alasan commands.yml pakai bot-cmd.
        env:
          REPO_URL: https://x-access-token:*** github.token }}@github.com/${{ github.repository }}.git
        run: |
          if git ls-remote --exit-code --heads "$REPO_URL" bot-calib >/dev/null 2>&1; then
            git clone --quiet --depth=1 --branch bot-calib "$REPO_URL" /tmp/botcalib
            cp /tmp/botcalib/calibration.json /tmp/botdata/calibration.json 2>/dev/null \
              && echo "calibration.json dimuat" || echo "belum ada calibration.json"
          else
            echo "branch bot-calib belum ada — backtest belum pernah jalan"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Pasang dependensi
        run: pip install -r requirements.txt

      - name: Jalankan bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_GROUP_ID: ${{ secrets.TELEGRAM_GROUP_ID }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          ACCOUNT_BALANCE: ${{ vars.ACCOUNT_BALANCE }}
          RISK_PCT: ${{ vars.RISK_PCT }}
          SIMPLE_MODE: "1"
          XAU_HOME: /tmp/botdata
        run: python xau_signal.py

      - name: Nilai hasil sinyal lama
        # Tiap 12 jam saja; jam 6 dan 18 UTC. Kondisi schedule sebelumnya
        # ('5 * * * *') tidak pernah cocok dengan cron aktual di atas
        # ("13 * * * *") — step ini TIDAK PERNAH jalan sejak awal, itu sebab
        # journal.csv tetap kosong walau sinyal sudah terkirim. Jalankan
        # setiap run dan biarkan pengecekan jam di dalam shell yang menyaring.
        if: ${{ github.event_name == 'schedule' }}
        continue-on-error: true
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          XAU_HOME: /tmp/botdata
        run: |
          H=$(date -u +%H)
          if [ "$H" = "06" ] || [ "$H" = "18" ]; then
            python journal.py update
          else
            echo "lewati (jam $H UTC)"
          fi

      - name: Simpan state
        if: always()
        env:
          REPO_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          cd /tmp/botdata
          rm -rf cache                    # cache harga tidak perlu disimpan

          # -e, bukan -d: .git bisa berupa berkas maupun folder
          if [ ! -e .git ]; then
            git init -q -b bot-data
          fi

          git config user.name  "xausignal-bot"
          git config user.email "bot@users.noreply.github.com"

          # Idempoten: set-url kalau sudah ada, add kalau belum
          git remote set-url origin "$REPO_URL" 2>/dev/null \
            || git remote add origin "$REPO_URL"

          git add -A
          if git diff --cached --quiet; then
            echo "tidak ada perubahan state"
          else
            git commit -q -m "state: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push -q origin HEAD:bot-data --force
            echo "state tersimpan"
          fi
